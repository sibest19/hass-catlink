name: Bug report
description: Something in the CatLink integration does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug, check the [troubleshooting section](https://github.com/sibest19/hass-catlink#troubleshooting) and search existing issues.

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "2026.11.0"
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: HACS → CatLink, or `version` in `custom_components/catlink/manifest.json`.
      placeholder: "3.0.0"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: CatLink device type
      description: The device the problem is about.
      options:
        - SCOOPER SE 2 / C08 (verified on real hardware)
        - Scooper (deviceType SCOOPER)
        - Scooper C1 / LITTER_BOX_599
        - Scooper Pro Ultra (VISUAL_PRO_ULTRA)
        - Feeder (FEEDER)
        - PurePro fountain (PUREPRO)
        - Cat profile
        - Other / unknown
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Account region
      description: The region selected when setting up the integration.
      options:
        - Global
        - China
        - USA
        - Singapore
        - Auto
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: |
        Enable debug logging by adding this to `configuration.yaml` and restarting Home Assistant:

        ```yaml
        logger:
          logs:
            custom_components.catlink: debug
        ```

        Reproduce the problem, then paste the relevant lines from Settings → System → Logs.
        **Redact your email, phone number and any tokens before posting.**
      render: text
    validations:
      required: true
