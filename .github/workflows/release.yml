name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-version:
    name: Tag and pre-release flag match manifest version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare tag with manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION=$(jq -r .version custom_components/catlink/manifest.json)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match manifest.json version (expected 'v$VERSION')."
            exit 1
          fi
          echo "Tag $TAG matches manifest.json version $VERSION."
          # A letter marks a pre-release (3.1.0b1, 3.1.0rc1). Only users who turn
          # on pre-releases get those, so the GitHub flag must agree.
          if [[ "$VERSION" =~ [a-z] ]]; then EXPECTED=true; else EXPECTED=false; fi
          if [ "$PRERELEASE" != "$EXPECTED" ]; then
            echo "::error::Version $VERSION needs 'Set as a pre-release' to be $EXPECTED, but it is $PRERELEASE."
            exit 1
          fi
