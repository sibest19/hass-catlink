name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-version:
    name: Tag matches manifest version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare tag with manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(jq -r .version custom_components/catlink/manifest.json)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match manifest.json version (expected 'v$VERSION')."
            exit 1
          fi
          echo "Tag $TAG matches manifest.json version $VERSION."
