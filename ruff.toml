target-version = "py313"

[lint]
# Errors only (pyflakes + pycodestyle E4/E7/E9) so the current code passes.
# shortcut: F401 is off because the platform modules still carry unused
# imports; drop the ignore after cleaning them up with `ruff check --fix`.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"]
